<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>店舗・予約設定</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f7f8;color:#1f2937}header{background:#111827;color:#fff;padding:18px 20px}header h1{margin:0;font-size:21px}main{max-width:1050px;margin:auto;padding:20px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px #0000000d}h2{margin-top:0}label{display:block;margin:10px 0 5px;font-weight:700}input,select,button,textarea{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;background:#fff}button,.btn{border:0;border-radius:9px;padding:10px 14px;background:#111827;color:#fff;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#fff;color:#111827;border:1px solid #d1d5db}.danger{background:#b91c1c}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.muted{color:#6b7280;font-size:14px}.message{margin-top:10px;font-weight:700}.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.row>div{flex:1;min-width:130px}.item{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin-top:12px}.item-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.menu-grid{display:grid;grid-template-columns:1fr 150px 100px;gap:8px;align-items:center;margin-top:8px}.week-row{display:grid;grid-template-columns:55px 80px 1fr 1fr;gap:8px;align-items:center;margin:7px 0}.week-row input[type=checkbox]{width:auto}.urlbox{overflow-wrap:anywhere;background:#f3f4f6;padding:12px;border-radius:9px}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2ff;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:720px){main{padding:12px}.grid2,.grid3{grid-template-columns:1fr}.menu-grid{grid-template-columns:1fr 100px 80px}.week-row{grid-template-columns:45px 70px 1fr 1fr;font-size:13px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body><header><h1>店舗・予約設定</h1></header><main>
<nav class="actions"><a class="btn" href="admin.html">予約管理へ</a></nav>
<form id="basicForm" class="card">
<h2>基本設定</h2>
<div class="grid2"><div><label>店舗名</label><input id="shopName" required></div><div><label>予約開始時刻の刻み</label><select id="slotMinutes"><option value="5">5分</option><option value="10">10分</option><option value="15">15分</option><option value="30">30分</option></select></div></div>
<div class="grid3"><div><label>予約できる日数（今日から）</label><input id="maxBookingDays" type="number" min="0" max="365" value="60"></div><div><label>当日予約</label><select id="sameDayBooking"><option value="true">受け付ける</option><option value="false">受け付けない</option></select></div><div><label>予約締切（開始何分前）</label><input id="cutoffMinutes" type="number" min="0" max="10080" step="5" value="0"></div></div>
<p class="muted">営業時間はスタイリストごとの勤務時間で判定します。退勤後にどこまで施術終了を許容するかも各スタイリストで設定できます。</p>
<button type="submit">基本設定を保存</button><div id="basicMessage" class="message"></div>
</form>

<section class="card"><h2>メニュー設定</h2><p class="muted">お客様は複数メニューを選択できます。実際の施術時間はスタイリストごとに設定します。</p>
<div class="row"><div><label>メニュー名</label><input id="newMenuName" placeholder="例：カット"></div><div><label>標準時間（分）</label><input id="newMenuDuration" type="number" min="5" step="5" value="40"></div><div style="flex:0"><button id="addMenu" type="button">＋追加</button></div></div>
<div id="menuList"></div><div id="menuMessage" class="message"></div></section>

<section class="card"><h2>スタイリスト設定</h2><p class="muted">勤務時間・退勤後の延長許容・次のお客様までのインターバル・担当メニューを個別に設定します。</p>
<div class="row"><div><label>スタイリスト名</label><input id="newStylistName" placeholder="例：田中"></div><div style="flex:0"><button id="addStylist" type="button">＋追加</button></div></div>
<div id="stylistList"></div><div id="stylistMessage" class="message"></div></section>

<section class="card"><h2>お客様用URL・QR</h2><p id="publicUrl" class="urlbox"></p><div id="qr"></div></section>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth,onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getDatabase,ref,get,set,update,push,remove } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyBH_4WbAPUfJe5L6cqveey4Qj7UYndyG8o",
  authDomain: "salon-reservation-74af5.firebaseapp.com",
  databaseURL: "https://salon-reservation-74af5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "salon-reservation-74af5",
  storageBucket: "salon-reservation-74af5.firebasestorage.app",
  messagingSenderId: "999192738309",
  appId: "1:999192738309:web:584f3724a552b80a0bba6c"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);let shop="",settings={},menus={},stylists={};
const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dayNames=["日","月","火","水","木","金","土"];
onAuthStateChanged(auth,async u=>{if(!u){location.href="login.html";return}const s=await get(ref(db,`users/${u.uid}/shopCode`));if(!s.exists()){alert("店舗設定がありません");return}shop=s.val();await loadAll();await bootstrapIfNeeded();await loadAll();renderAll();renderPublicUrl()});
async function loadAll(){const [a,b,c]=await Promise.all([get(ref(db,`shops/${shop}/settings`)),get(ref(db,`shops/${shop}/menus`)),get(ref(db,`shops/${shop}/stylists`))]);settings=a.val()||{};menus=b.val()||{};stylists=c.val()||{}}
async function bootstrapIfNeeded(){const updates={};let menuId=Object.keys(menus)[0];if(!menuId){menuId="cut";updates[`shops/${shop}/menus/${menuId}`]={name:"カット",defaultDuration:40,active:true,sort:1}}if(!Object.keys(stylists).length){const closed=settings.closedDays||[];const weekly={};for(let d=0;d<7;d++)weekly[d]={enabled:!closed.includes(d),start:settings.openTime||"09:00",end:settings.closeTime||"19:00"};updates[`shops/${shop}/stylists/stylist1`]={name:"スタイリスト1",active:true,sort:1,intervalMinutes:10,extensionMinutes:0,weeklySchedule:weekly,menuDurations:{[menuId]:40}}}if(Object.keys(updates).length)await update(ref(db),updates)}
function renderAll(){ $("#shopName").value=settings.shopName||"";$("#slotMinutes").value=String(settings.slotMinutes||10);$("#maxBookingDays").value=settings.maxBookingDays??60;$("#sameDayBooking").value=String(settings.sameDayBooking!==false);$("#cutoffMinutes").value=settings.cutoffMinutes??0;renderMenus();renderStylists()}
$("#basicForm").addEventListener("submit",async e=>{e.preventDefault();await update(ref(db,`shops/${shop}/settings`),{shopName:$("#shopName").value.trim(),slotMinutes:Number($("#slotMinutes").value),maxBookingDays:Number($("#maxBookingDays").value),sameDayBooking:$("#sameDayBooking").value==="true",cutoffMinutes:Number($("#cutoffMinutes").value)});$("#basicMessage").textContent="保存しました。";await loadAll()});
$("#addMenu").onclick=async()=>{const name=$("#newMenuName").value.trim(),duration=Number($("#newMenuDuration").value);if(!name||duration<5)return;const p=push(ref(db,`shops/${shop}/menus`));await set(p,{name,defaultDuration:duration,active:true,sort:Date.now()});$("#newMenuName").value="";await loadAll();renderMenus();renderStylists()};
function renderMenus(){const box=$("#menuList");box.innerHTML="";Object.entries(menus).sort((a,b)=>(a[1].sort||0)-(b[1].sort||0)).forEach(([id,m])=>{const el=document.createElement("div");el.className="item";el.innerHTML=`<div class="grid3"><div><label>メニュー名</label><input class="mn" value="${esc(m.name)}"></div><div><label>標準時間</label><input class="md" type="number" min="5" step="5" value="${Number(m.defaultDuration||40)}"></div><div><label>公開</label><select class="ma"><option value="true" ${m.active!==false?"selected":""}>表示</option><option value="false" ${m.active===false?"selected":""}>非表示</option></select></div></div><div class="actions"><button class="save" type="button">保存</button><button class="delete danger" type="button">削除</button></div>`;el.querySelector(".save").onclick=async()=>{await update(ref(db,`shops/${shop}/menus/${id}`),{name:el.querySelector(".mn").value.trim(),defaultDuration:Number(el.querySelector(".md").value),active:el.querySelector(".ma").value==="true"});$("#menuMessage").textContent="保存しました。";await loadAll();renderStylists()};el.querySelector(".delete").onclick=async()=>{if(!confirm("このメニューを削除しますか？"))return;await remove(ref(db,`shops/${shop}/menus/${id}`));await loadAll();renderMenus();renderStylists()};box.appendChild(el)})}
$("#addStylist").onclick=async()=>{const name=$("#newStylistName").value.trim();if(!name)return;const weekly={};for(let d=0;d<7;d++)weekly[d]={enabled:d!==0,start:"09:00",end:"19:00"};const durations={};Object.entries(menus).forEach(([id,m])=>durations[id]=Number(m.defaultDuration||40));const p=push(ref(db,`shops/${shop}/stylists`));await set(p,{name,active:true,sort:Date.now(),intervalMinutes:10,extensionMinutes:0,weeklySchedule:weekly,menuDurations:durations});$("#newStylistName").value="";await loadAll();renderStylists()};
function renderStylists(){const box=$("#stylistList");box.innerHTML="";Object.entries(stylists).sort((a,b)=>(a[1].sort||0)-(b[1].sort||0)).forEach(([id,s])=>{const el=document.createElement("div");el.className="item";const week=Array.from({length:7},(_,d)=>{const w=s.weeklySchedule?.[d]||{enabled:false,start:"09:00",end:"19:00"};return `<div class="week-row"><b>${dayNames[d]}</b><label style="margin:0"><input data-day="${d}" class="wen" type="checkbox" ${w.enabled?"checked":""}> 出勤</label><input data-day="${d}" class="wstart" type="time" value="${w.start||"09:00"}"><input data-day="${d}" class="wend" type="time" value="${w.end||"19:00"}"></div>`}).join("");const mg=Object.entries(menus).sort((a,b)=>(a[1].sort||0)-(b[1].sort||0)).map(([mid,m])=>{const val=s.menuDurations?.[mid];return `<div class="menu-grid"><span>${esc(m.name)}</span><input class="dur" data-mid="${mid}" type="number" min="0" step="5" value="${val??0}"><span class="muted">${Number(val)>0?"対応":"不可"}</span></div>`}).join("");el.innerHTML=`<div class="item-head"><h3 style="margin:0">${esc(s.name)}</h3><span class="pill">個別設定</span></div><div class="grid3"><div><label>表示名</label><input class="sn" value="${esc(s.name)}"></div><div><label>インターバル（分）</label><input class="si" type="number" min="0" step="5" value="${Number(s.intervalMinutes||0)}"></div><div><label>退勤後の延長許容（分）</label><input class="se" type="number" min="0" step="5" value="${Number(s.extensionMinutes||0)}"></div></div><label>通常の週間勤務</label>${week}<label>対応メニューと施術時間</label><p class="muted">0分にすると、そのメニューは担当不可になります。</p>${mg}<div class="actions"><button class="save" type="button">このスタイリストを保存</button><button class="delete danger" type="button">削除</button></div>`;el.querySelector(".save").onclick=async()=>{const weekly={};for(let d=0;d<7;d++){weekly[d]={enabled:el.querySelector(`.wen[data-day="${d}"]`).checked,start:el.querySelector(`.wstart[data-day="${d}"]`).value,end:el.querySelector(`.wend[data-day="${d}"]`).value}}const menuDurations={};el.querySelectorAll(".dur").forEach(x=>menuDurations[x.dataset.mid]=Number(x.value||0));await update(ref(db,`shops/${shop}/stylists/${id}`),{name:el.querySelector(".sn").value.trim(),intervalMinutes:Number(el.querySelector(".si").value||0),extensionMinutes:Number(el.querySelector(".se").value||0),weeklySchedule:weekly,menuDurations,active:true});$("#stylistMessage").textContent="保存しました。";await loadAll();renderStylists()};el.querySelector(".delete").onclick=async()=>{if(!confirm("このスタイリストを削除しますか？"))return;await remove(ref(db,`shops/${shop}/stylists/${id}`));await loadAll();renderStylists()};box.appendChild(el)})}
function renderPublicUrl(){const url=new URL("reserve.html",location.href);url.searchParams.set("shop",shop);$("#publicUrl").textContent=url.href;const qr=$("#qr");qr.innerHTML="";if(window.QRCode)new QRCode(qr,{text:url.href,width:180,height:180})}
</script></body></html>
