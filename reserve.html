<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>予約</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f7f8;color:#1f2937}
header{background:#111827;color:white;padding:18px 20px}header h1{margin:0;font-size:21px}
main{max-width:900px;margin:auto;padding:20px}.card{background:white;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px #0000000d}
label{display:block;margin:12px 0 5px;font-weight:650}input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;font:inherit}
textarea{min-height:80px}button,.btn{border:0;border-radius:9px;padding:11px 15px;background:#111827;color:white;cursor:pointer;text-decoration:none;display:inline-block;font:inherit}
button:disabled{background:#d1d5db}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{background:white;color:#111827;border:1px solid #d1d5db}.choice.active{background:#111827;color:white}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.muted{color:#6b7280}.message{margin-top:12px;font-weight:650}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.complete{display:none;text-align:center}.complete.show{display:block}.datetime{font-size:30px;font-weight:850;padding:20px;border:2px solid #111827;border-radius:14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}main{padding:12px}}
</style></head><body>
<header><h1 id="shopName">美容室予約</h1></header><main id="booking">
<div class="card"><h2>予約日</h2><div id="dates" class="choices"></div></div>
<div class="card"><h2>空いている時間</h2><div id="slots" class="choices"></div><p class="muted">グレーの時間は予約できません。</p></div>
<form id="form" class="card"><h2>お客様情報</h2><label>お名前</label><input id="name" required><label>連絡先</label><input id="phone" required>
<label>希望スタイル</label><select id="styleSel" required><option value="">選択してください</option><option>カット</option><option>ツーブロック</option><option>坊主</option><option>短め</option><option>整える程度</option><option>その他</option></select>
<label>備考（任意）</label><textarea id="note"></textarea><br><button>予約を確定する</button><div id="msg" class="message"></div></form>
<div id="complete" class="card complete"><h2>ご予約ありがとうございます。</h2><p>お客様のご予約は</p><div id="dt" class="datetime"></div><p>です。</p><p><b>この画面をスクリーンショットして保存してください。</b></p></div>
</main><script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getDatabase, ref, get, set, update, push, remove, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyBH_4WbAPUfJe5L6cqveey4Qj7UYndyG8o",
  authDomain: "salon-reservation-74af5.firebaseapp.com",
  databaseURL: "https://salon-reservation-74af5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "salon-reservation-74af5",
  storageBucket: "salon-reservation-74af5.firebasestorage.app",
  messagingSenderId: "999192738309",
  appId: "1:999192738309:web:584f3724a552b80a0bba6c"
};
const app=initializeApp(firebaseConfig),db=getDatabase(app),shop=new URLSearchParams(location.search).get("shop")||"demo";
let settings={},selectedDate="",selectedTime="";
const dk=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const tm=t=>{const [h,m]=t.split(":").map(Number);return h*60+m}, mt=n=>`${String(Math.floor(n/60)).padStart(2,"0")}:${String(n%60).padStart(2,"0")}`;
const ss=await get(ref(db,`shops/${shop}/settings`)); if(ss.exists()) settings=ss.val(); shopName.textContent=settings.shopName||"美容室予約";
for(let i=0;i<=Math.min(90,Number(settings.maxBookingDays??7));i++){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+i);if((settings.closedDays||[]).includes(d.getDay()))continue;
 const b=document.createElement("button");b.type="button";b.className="choice";b.textContent=`${d.getMonth()+1}/${d.getDate()}`;b.onclick=()=>selectDate(d,b);dates.appendChild(b);}
async function selectDate(d,b){[...dates.children].forEach(x=>x.classList.remove("active"));b.classList.add("active");selectedDate=dk(d);selectedTime="";slots.textContent="読み込み中...";
 const [st,ct,bl,br]=await Promise.all([get(ref(db,`shops/${shop}/staffing/${selectedDate}`)),get(ref(db,`shops/${shop}/slotCounts/${selectedDate}`)),get(ref(db,`shops/${shop}/blockedTimes/${selectedDate}`)),get(ref(db,`shops/${shop}/staffBreaks/${selectedDate}`))]);
 const staff=st.val()||{},counts=ct.val()||{},blocked=bl.val()||{},breaks=br.val()||{};slots.innerHTML="";
 for(let m=tm(settings.openTime||"09:00");m<tm(settings.closeTime||"19:00");m+=Number(settings.slotMinutes||15)){const t=mt(m),k=t.replace(":","");let cap=Number(staff.staffCount??settings.defaultStaffCount??1)-Number(breaks[k]||0);
  const now=new Date(),past=selectedDate===dk(now)&&m<=now.getHours()*60+now.getMinutes();const x=document.createElement("button");x.type="button";x.className="choice";x.textContent=t;x.disabled=past||!!blocked[k]||Number(counts[k]||0)>=cap||cap<=0;
  x.onclick=()=>{[...slots.children].forEach(y=>y.classList.remove("active"));x.classList.add("active");selectedTime=t};slots.appendChild(x);}}
form.onsubmit=async e=>{e.preventDefault();if(!selectedDate||!selectedTime){msg.textContent="日付と時間を選択してください。";return}
 const k=selectedTime.replace(":",""),st=(await get(ref(db,`shops/${shop}/staffing/${selectedDate}`))).val()||{},br=(await get(ref(db,`shops/${shop}/staffBreaks/${selectedDate}`))).val()||{};
 const cap=Number(st.staffCount??settings.defaultStaffCount??1)-Number(br[k]||0);const counter=ref(db,`shops/${shop}/slotCounts/${selectedDate}/${k}`);
 const tx=await runTransaction(counter,c=>{const n=Number(c||0);if(n>=cap)return;return n+1});if(!tx.committed){msg.textContent="この時間は埋まりました。別の時間を選択してください。";return}
 try{await set(push(ref(db,`shops/${shop}/reservations/${selectedDate}`)),{time:selectedTime,name:name.value.trim(),phone:phone.value.trim(),style:styleSel.value,note:note.value.trim(),createdAt:Date.now()});form.style.display="none";booking.querySelectorAll(".card")[0].style.display="none";booking.querySelectorAll(".card")[1].style.display="none";dt.textContent=`${selectedDate} ${selectedTime}から`;complete.classList.add("show");}catch(err){await runTransaction(counter,c=>Math.max(0,Number(c||1)-1));msg.textContent="予約保存に失敗しました。";}};
</script></body></html>
