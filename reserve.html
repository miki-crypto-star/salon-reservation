<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ご予約</title><style>
:root{--bg:#f6f7f8;--card:#fff;--text:#1f2937;--sub:#6b7280;--line:#e5e7eb;--dark:#111827;--danger:#b91c1c;--accent:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--dark);color:#fff;padding:18px 20px}header h1{margin:0;font-size:21px}main{max-width:1180px;margin:auto;padding:20px}
.card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px #0000000d}h2,h3{margin-top:0}
label{display:block;margin:10px 0 5px;font-weight:700}.muted{color:var(--sub);font-size:14px}.small{font-size:12px}.big{font-size:27px;font-weight:850}
input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;background:#fff}textarea{min-height:80px}
button,.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--dark);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#fff!important;color:var(--dark)!important;border:1px solid #d1d5db!important}.danger{background:var(--danger)!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.message{font-weight:700;margin-top:10px}.choice{background:#fff;color:var(--dark);border:1px solid #d1d5db;margin:4px}.choice.active{background:var(--dark);color:#fff}.choice:disabled{opacity:.35;cursor:not-allowed}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px}.warn{background:#fff7ed;padding:12px;border-radius:10px;font-weight:700}.hidden{display:none!important}.center{text-align:center}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.staffCol{border-left:4px solid #d1d5db;padding-left:12px}
@media(max-width:760px){main{padding:12px}.grid2,.grid3,.grid4{grid-template-columns:1fr}.row>*{flex-basis:100%}th,td{font-size:12px;padding:6px}}
</style></head><body><header><h1 id="title">美容室予約</h1></header><main>
<section class="card"><h2>1. メニューを選択</h2><div id="menuList"></div><p class="muted">複数選択できます。</p></section><section class="card"><h2>2. 担当スタイリスト</h2><select id="staffSel"><option value="any">担当者は誰でもOK</option></select></section><section class="card"><h2>3. 日付</h2><div id="dates"></div></section><section class="card"><h2>4. 空いている時間</h2><div id="slots"></div><p class="muted">選択したメニューを連続して施術できる時間だけ表示します。</p></section>
<form id="form" class="card"><h2>5. お客様情報</h2><label>お名前</label><input id="custName" required><label>電話番号</label><input id="phone" required><label>備考（任意）</label><textarea id="note"></textarea><br><br><button>予約を確定する</button><div id="msg" class="message"></div></form>
<section id="done" class="card hidden center"><h2 class="big">ご予約ありがとうございます。</h2><p>お客様のご予約は</p><div id="doneTime" class="big"></div><p id="doneInfo"></p><p class="warn">📱 念のため、この画面をスクリーンショットして保存してください。</p><button id="calendarBtn" type="button">カレンダーに追加</button></section>
</main><script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getDatabase, ref, get, set, update, push, remove, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyBH_4WbAPUfJe5L6cqveey4Qj7UYndyG8o",
  authDomain: "salon-reservation-74af5.firebaseapp.com",
  databaseURL: "https://salon-reservation-74af5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "salon-reservation-74af5",
  storageBucket: "salon-reservation-74af5.firebasestorage.app",
  messagingSenderId: "999192738309",
  appId: "1:999192738309:web:584f3724a552b80a0bba6c"
};

const app=initializeApp(firebaseConfig),db=getDatabase(app),shop=new URLSearchParams(location.search).get('shop')||'demo';
const menuList=document.getElementById('menuList'),staffSel=document.getElementById('staffSel'),dates=document.getElementById('dates'),
slots=document.getElementById('slots'),form=document.getElementById('form'),custName=document.getElementById('custName'),
phone=document.getElementById('phone'),note=document.getElementById('note'),msg=document.getElementById('msg'),done=document.getElementById('done'),
doneTime=document.getElementById('doneTime'),doneInfo=document.getElementById('doneInfo'),calendarBtn=document.getElementById('calendarBtn'),
title=document.getElementById('title');
let settings={},menus={},staff={},selectedMenus=[],selectedDate='',selectedChoice=null;
const tmin=t=>{const[a,b]=t.split(':').map(Number);return a*60+b},fmt=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
const dkey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const lockKeys=(start,end)=>{const a=[];for(let m=Math.floor(start/5)*5;m<end;m+=5)a.push(String(m));return a};
const snap=await get(ref(db,`shops/${shop}`));if(!snap.exists()){msg.textContent='店舗設定がありません。';throw new Error('shop not found')}
const v=snap.val();settings=v.settings||{};menus=v.menus||{};staff=v.staff||{};title.textContent=settings.shopName||'美容室予約';
Object.entries(menus).forEach(([id,m])=>menuList.insertAdjacentHTML('beforeend',`<label class="item"><input style="width:auto" type="checkbox" value="${id}"> ${m.name} <span class="muted">基本 ${m.baseMinutes||0}分</span></label>`));
Object.entries(staff).forEach(([id,s])=>staffSel.add(new Option(s.name,id)));
menuList.onchange=()=>{selectedMenus=[...menuList.querySelectorAll('input:checked')].map(x=>x.value);renderDates()};staffSel.onchange=renderDates;
function eligible(sid){return selectedMenus.length>0&&selectedMenus.every(mid=>staff[sid]?.services?.[mid]?.enabled)}
function duration(sid){return selectedMenus.reduce((n,mid)=>n+(+staff[sid].services[mid].minutes||+menus[mid].baseMinutes||0),0)}
function daySchedule(sid,dateObj,overrides){const w=overrides?.[sid]||staff[sid]?.weekly?.[dateObj.getDay()];if(!w||w.off)return null;return w}
function renderDates(){dates.innerHTML='';slots.innerHTML='';selectedChoice=null;if(!selectedMenus.length)return;let ids=Object.keys(staff).filter(eligible);if(staffSel.value!=='any')ids=ids.filter(x=>x===staffSel.value);if(!ids.length){dates.textContent='このメニューに対応できるスタイリストがいません。';return}const today=new Date();today.setHours(0,0,0,0);const first=settings.sameDay===false?1:0,max=+settings.maxBookingDays||90;for(let i=first;i<=max;i++){const d=new Date(today);d.setDate(d.getDate()+i);if((settings.closedDays||[]).includes(d.getDay()))continue;const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=`${d.getMonth()+1}/${d.getDate()}`;b.onclick=async()=>{[...dates.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedDate=dkey(d);await renderSlots(d)};dates.append(b)}}
async function renderSlots(d){slots.textContent='読み込み中...';selectedChoice=null;const date=dkey(d);const [lockSnap,blockSnap,ovSnap]=await Promise.all([get(ref(db,`shops/${shop}/locks/${date}`)),get(ref(db,`shops/${shop}/blocks/${date}`)),get(ref(db,`shops/${shop}/workOverrides/${date}`))]);const locks=lockSnap.val()||{},blocks=blockSnap.val()||{},overrides=ovSnap.val()||{};let ids=Object.keys(staff).filter(eligible);if(staffSel.value!=='any')ids=ids.filter(x=>x===staffSel.value);const byTime=new Map(),now=new Date(),step=+settings.slotStep||10;for(const sid of ids){const w=daySchedule(sid,d,overrides);if(!w)continue;const baseStart=tmin(w.start),baseEnd=tmin(w.end),limit=baseEnd+(+staff[sid].extensionMinutes||0),dur=duration(sid),gap=+staff[sid].intervalMinutes||0;for(let start=baseStart;start+dur<=limit;start+=step){const startDt=new Date(d.getFullYear(),d.getMonth(),d.getDate(),Math.floor(start/60),start%60);if(startDt.getTime()-now.getTime() < (+settings.cutoffMinutes||0)*60000)continue;const end=start+dur;let bad=false;for(const k of lockKeys(start,end+gap))if(locks?.[sid]?.[k]){bad=true;break}if(!bad)for(const b of Object.values(blocks?.[sid]||{}))if(start<+b.end&&end>+b.start){bad=true;break}if(!bad){const key=fmt(start);if(!byTime.has(key))byTime.set(key,[]);byTime.get(key).push({sid,start,end,gap})}}}slots.innerHTML='';[...byTime.entries()].sort((a,b)=>a[0].localeCompare(b[0])).forEach(([time,arr])=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=time;b.onclick=()=>{[...slots.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedChoice=arr[0]};slots.append(b)});if(!slots.children.length)slots.textContent='この日は予約可能な時間がありません。'}
async function acquire(date,sid,start,end,gap,bid){const rr=ref(db,`shops/${shop}/locks/${date}/${sid}`),need=lockKeys(start,end+gap);let ok=false;const tx=await runTransaction(rr,c=>{c=c||{};if(need.some(k=>c[k]))return;for(const k of need)c[k]=bid;ok=true;return c});return ok&&tx.committed}
async function release(date,sid,bid){await runTransaction(ref(db,`shops/${shop}/locks/${date}/${sid}`),c=>{if(!c)return c;for(const[k,v]of Object.entries(c))if(v===bid)delete c[k];return c})}
form.onsubmit=async e=>{e.preventDefault();msg.textContent='';if(!selectedDate||!selectedChoice){msg.textContent='日時を選択してください。';return}const sid=selectedChoice.sid,s=staff[sid],bid=push(ref(db,`shops/${shop}/reservations/${selectedDate}`)).key;const ok=await acquire(selectedDate,sid,selectedChoice.start,selectedChoice.end,selectedChoice.gap,bid);if(!ok){msg.textContent='申し訳ありません。直前に別の予約が入りました。時間を選び直してください。';return}const rec={staffId:sid,staffName:s.name,start:selectedChoice.start,end:selectedChoice.end,menus:selectedMenus.reduce((o,mid)=>(o[mid]={name:menus[mid].name,minutes:+s.services[mid].minutes||+menus[mid].baseMinutes},o),{}),name:custName.value.trim(),phone:phone.value.trim(),note:note.value.trim(),status:'reserved',source:'web',createdAt:Date.now()};try{await set(ref(db,`shops/${shop}/reservations/${selectedDate}/${bid}`),rec)}catch(err){await release(selectedDate,sid,bid);msg.textContent='予約保存に失敗しました。';return}document.querySelectorAll('main > section, main > form').forEach(x=>x.classList.add('hidden'));done.classList.remove('hidden');doneTime.textContent=`${selectedDate} ${fmt(rec.start)}から`;doneInfo.textContent=`担当：${s.name} / ${selectedMenus.map(mid=>menus[mid].name).join('＋')}`;calendarBtn.onclick=()=>downloadICS(rec,selectedDate)};
function downloadICS(rec,date){const [y,m,d]=date.split('-').map(Number),pad=n=>String(n).padStart(2,'0'),dt=n=>`${y}${pad(m)}${pad(d)}T${pad(Math.floor(n/60))}${pad(n%60)}00`;const title=`${settings.shopName||'美容室'} 予約`,desc=`担当：${rec.staffName} / ${Object.values(rec.menus).map(x=>x.name).join('＋')}`;const ics=`BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nDTSTART:${dt(rec.start)}\nDTEND:${dt(rec.end)}\nSUMMARY:${title}\nDESCRIPTION:${desc}\nEND:VEVENT\nEND:VCALENDAR`;const blob=new Blob([ics],{type:'text/calendar'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='salon-reservation.ics';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
</script></body></html>
