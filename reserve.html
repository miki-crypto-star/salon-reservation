const tmin=t=>{const[a,b]=String(t).split(':').map(Number);return a*60+b},fmt=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`,dkey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,lockKeys=(start,end)=>{const a=[];for(let m=Math.floor(start/5)*5;m<end;m+=5)a.push(String(m));return a},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function renderMenus(){menuList.innerHTML='';for(const [id,m] of Object.entries(menus))menuList.insertAdjacentHTML('beforeend',`<label class="item"><input style="width:auto" type="checkbox" value="${id}"> ${esc(m.name)} <span class="muted">基本 ${Number(m.baseMinutes)||0}分</span></label>`);if(!Object.keys(menus).length)menuList.innerHTML='<p class="muted">現在予約できるメニューがありません。</p>';}

function renderDates(){dates.innerHTML='';slots.innerHTML='';selectedChoice=null;if(!selectedMenus.length)return;let ids=Object.keys(staff).filter(eligible);if(staffSel.value!=='any')ids=ids.filter(x=>x===staffSel.value);if(!ids.length){dates.textContent='このメニューに対応できるスタイリストがいません。';return}const today=new Date();today.setHours(0,0,0,0);const first=settings.sameDay===false?1:0,max=+settings.maxBookingDays||90;for(let i=first;i<=max;i++){const d=new Date(today);d.setDate(d.getDate()+i);if(closed(d.getDay()))continue;const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=`${d.getMonth()+1}/${d.getDate()}`;b.onclick=async()=>{[...dates.children].forEach(x=>x.classList.remove('active'));b.classList.add('active');selectedDate=dkey(d);await renderSlots(d)};dates.append(b)}}
async function renderSlots(d){slots.textContent='読み込み中...';selectedChoice=null;const date=dkey(d);try{const [ls,bs,os]=await Promise.all([get(ref(db,`shops/${shop}/locks/${date}`)),get(ref(db,`shops/${shop}/blocks/${date}`)),get(ref(db,`shops/${shop}/workOverrides/${date}`))]);const locks=ls.val()||{},blocks=bs.val()||{},overrides=os.val()||{};let ids=Object.keys(staff).filter(eligible);if(staffSel.value!=='any')ids=ids.filter(x=>x===staffSel.value);slots.innerHTML='';let any=false;for(const sid of ids){const w=daySchedule(sid,d,overrides);if(!w)continue;const dur=duration(sid),gap=+staff[sid].intervalMinutes||0,baseStart=tmin(w.start),limit=tmin(w.end)+(+staff[sid].extensionMinutes||0),section=document.createElement('div');section.className='item';section.innerHTML=`<h3>${esc(staff[sid].name)} <span class="muted">${dur}分</span></h3>`;const buttons=document.createElement('div');const now=new Date(),step=+settings.slotStep||10;let count=0;for(let start=baseStart;start+dur<=limit;start+=step){const startDt=new Date(d.getFullYear(),d.getMonth(),d.getDate(),Math.floor(start/60),start%60);if(startDt.getTime()-now.getTime() < (+settings.cutoffMinutes||0)*60000)continue;const end=start+dur;let bad=lockKeys(start,end+gap).some(k=>locks?.[sid]?.[k]);if(!bad)bad=Object.values(blocks?.[sid]||{}).some(b=>start<+b.end&&end>+b.start);if(bad)continue;const btn=document.createElement('button');btn.type='button';btn.className='choice';btn.textContent=fmt(start);btn.onclick=()=>{slots.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));btn.classList.add('active');selectedChoice={sid,start,end,gap}};buttons.append(btn);count++}if(count){section.append(buttons);slots.append(section);any=true}}if(!any)slots.textContent='この日は予約可能な時間がありません。';}catch(err){console.error(err);slots.textContent='空き時間を読み込めません：'+(err.code||err.message||err);}}
async function acquire(date,sid,start,end,gap,bid){const rr=ref(db,`shops/${shop}/locks/${date}/${sid}`),need=lockKeys(start,end+gap);let ok=false;const tx=await runTransaction(rr,c=>{c=c||{};if(need.some(k=>c[k]))return;for(const k of need)c[k]=bid;ok=true;return c});return ok&&tx.committed}async function release(date,sid,bid){await runTransaction(ref(db,`shops/${shop}/locks/${date}/${sid}`),c=>{if(!c)return c;for(const[k,v]of Object.entries(c))if(v===bid)delete c[k];return c})}
form.onsubmit=async e=>{e.preventDefault();msg.textContent='';if(!selectedDate||!selectedChoice){msg.textContent='日付と時間を選択してください。';return}const sid=selectedChoice.sid,s=staff[sid],bid=push(ref(db,`shops/${shop}/reservations/${selectedDate}`)).key;if(!await acquire(selectedDate,sid,selectedChoice.start,selectedChoice.end,selectedChoice.gap,bid)){msg.textContent='申し訳ありません。直前に別の予約が入りました。時間を選び直してください。';return}const rec={staffId:sid,staffName:s.name,start:selectedChoice.start,end:selectedChoice.end,menus:selectedMenus.reduce((o,mid)=>(o[mid]={name:menus[mid].name,minutes:+s.services[mid].minutes||+menus[mid].baseMinutes},o),{}),name:custName.value.trim(),phone:phone.value.trim(),note:note.value.trim(),status:'reserved',source:'web',createdAt:Date.now()};try{await set(ref(db,`shops/${shop}/reservations/${selectedDate}/${bid}`),rec)}catch(err){await release(selectedDate,sid,bid);msg.textContent='予約保存に失敗しました：'+(err.code||err.message||err);return}document.querySelectorAll('main > section, main > form').forEach(x=>x.classList.add('hidden'));done.classList.remove('hidden');doneTime.textContent=`${selectedDate} ${fmt(rec.start)}から`;doneInfo.textContent=`担当：${s.name} / ${selectedMenus.map(mid=>menus[mid].name).join('＋')}`;setupCalendar(rec,selectedDate)};
