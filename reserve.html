<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>美容室予約</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f7f8;color:#1f2937}header{background:#111827;color:#fff;padding:18px 20px}header h1{margin:0;font-size:21px}main{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px #0000000d}h2{margin-top:0}button,input,textarea{font:inherit}button{border:0;border-radius:9px;padding:11px 15px;background:#111827;color:#fff;cursor:pointer}button:disabled{background:#d1d5db;color:#6b7280;cursor:not-allowed}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{background:#fff;color:#111827;border:1px solid #d1d5db}.choice.active{background:#111827;color:#fff}.menu-item{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin:8px 0}.menu-item input{width:auto}.menu-item label{flex:1;font-weight:700}.muted{color:#6b7280;font-size:14px}.summary{background:#eef2ff;padding:12px;border-radius:10px;font-weight:700;margin-top:12px}.slot-sub{display:block;font-size:12px;margin-top:2px;opacity:.75}label{display:block;margin:12px 0 5px;font-weight:700}input,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;background:#fff}textarea{min-height:80px}.message{margin-top:12px;font-weight:700}.complete-card{display:none;text-align:center;padding:28px 18px}.complete-card.show{display:block}.complete-title{font-size:28px}.complete-booking{background:#f3f4f6;border:2px solid #111827;border-radius:14px;padding:22px 16px;margin:18px 0}.datetime{font-size:28px;font-weight:850}.screenshot-note{margin-top:20px;padding:14px;border-radius:10px;background:#fff7ed;font-weight:700;line-height:1.6}@media(max-width:640px){main{padding:12px}}
</style></head><body><header><h1 id="shopName">美容室予約</h1></header><main>
<section id="menuCard" class="card"><h2>1. メニューを選ぶ</h2><div id="menus"></div><div id="menuSummary" class="summary">メニューを選択してください。</div></section>
<section id="stylistCard" class="card"><h2>2. 担当スタイリスト</h2><div id="stylists" class="choices"></div><p class="muted">選んだメニューすべてに対応できるスタイリストだけ表示します。</p></section>
<section id="dateCard" class="card"><h2>3. 予約日</h2><div id="dates" class="choices"></div></section>
<section id="slotCard" class="card"><h2>4. 空いている時間</h2><div id="slots" class="choices"></div><p class="muted">選択メニューの合計施術時間が連続して確保できる時間だけ表示します。</p></section>
<form id="bookingForm" class="card"><h2>5. お客様情報</h2><label>お名前</label><input id="name" required maxlength="50"><label>連絡先</label><input id="phone" required maxlength="30" inputmode="tel"><label>備考（任意）</label><textarea id="note" maxlength="200"></textarea><br><button id="submitBtn" type="submit">予約を確定する</button><div id="message" class="message"></div></form>
<section id="completeCard" class="card complete-card"><h2 class="complete-title">ご予約ありがとうございます。</h2><div class="complete-booking"><div>お客様のご予約は</div><div id="completeDateTime" class="datetime"></div><div id="completeDetail" style="margin-top:10px"></div></div><button id="calendarButton" type="button">📅 カレンダーに追加</button><div class="screenshot-note">📱 念のため、この画面をスクリーンショットして保存してください。</div><p class="muted">ご来店をお待ちしております。</p></section>
</main><script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";import { getDatabase,ref,get,set,push,runTransaction } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyBH_4WbAPUfJe5L6cqyeey4Qj7UYndyG8o",authDomain:"salon-reservation-74af5.firebaseapp.com",databaseURL:"https://salon-reservation-74af5-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"salon-reservation-74af5",storageBucket:"salon-reservation-74af5.firebasestorage.app",messagingSenderId:"999192738309",appId:"1:999192738309:web:584f3724a552b80a0bb6ac"};const app=initializeApp(firebaseConfig),db=getDatabase(app);
const $=s=>document.querySelector(s),shop=new URLSearchParams(location.search).get("shop")||"demo";let settings={},menus={},stylists={},selectedMenus=[],selectedStylist="",selectedDate="",selectedTime="",selectedDuration=0,selectedStylistId="",completed=null;
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}function t2m(t){const [h,m]=t.split(":").map(Number);return h*60+m}function m2t(n){return `${String(Math.floor(n/60)).padStart(2,"0")}:${String(n%60).padStart(2,"0")}`}function pad(n){return String(n).padStart(2,"0")}
const [ss,ms,sts]=await Promise.all([get(ref(db,`shops/${shop}/settings`)),get(ref(db,`shops/${shop}/menus`)),get(ref(db,`shops/${shop}/stylists`))]);settings=ss.val()||{};menus=ms.val()||{};stylists=sts.val()||{};$("#shopName").textContent=settings.shopName||shop;renderMenus();renderStylists();renderDates();
function activeMenuEntries(){return Object.entries(menus).filter(([,m])=>m.active!==false).sort((a,b)=>(a[1].sort||0)-(b[1].sort||0))}
function renderMenus(){const box=$("#menus");box.innerHTML="";activeMenuEntries().forEach(([id,m])=>{const row=document.createElement("div");row.className="menu-item";row.innerHTML=`<input id="m_${id}" type="checkbox" value="${id}"><label for="m_${id}">${m.name}</label>`;row.querySelector("input").onchange=()=>{selectedMenus=[...box.querySelectorAll("input:checked")].map(x=>x.value);selectedStylist="";selectedTime="";updateMenuSummary();renderStylists();$("#slots").innerHTML=""};box.appendChild(row)});if(!activeMenuEntries().length)box.textContent="現在予約できるメニューがありません。"}
function compatible(id){const s=stylists[id];return s&&s.active!==false&&selectedMenus.length&&selectedMenus.every(mid=>Number(s.menuDurations?.[mid]||0)>0)}function durationFor(id){return selectedMenus.reduce((n,mid)=>n+Number(stylists[id]?.menuDurations?.[mid]||0),0)}
function updateMenuSummary(){if(!selectedMenus.length){$("#menuSummary").textContent="メニューを選択してください。";return}const names=selectedMenus.map(id=>menus[id]?.name).filter(Boolean);$("#menuSummary").textContent=`選択：${names.join(" ＋ ")}　※施術時間は担当者によって変わります。`}
function renderStylists(){const box=$("#stylists");box.innerHTML="";if(!selectedMenus.length){box.textContent="先にメニューを選択してください。";return}const ids=Object.keys(stylists).filter(compatible).sort((a,b)=>(stylists[a].sort||0)-(stylists[b].sort||0));if(!ids.length){box.textContent="選択メニューすべてに対応できるスタイリストがいません。";return}const any=document.createElement("button");any.type="button";any.className="choice";any.textContent="誰でもOK";any.onclick=()=>selectStylist("",any);box.appendChild(any);ids.forEach(id=>{const b=document.createElement("button");b.type="button";b.className="choice";b.innerHTML=`${stylists[id].name}<span class="slot-sub">${durationFor(id)}分</span>`;b.onclick=()=>selectStylist(id,b);box.appendChild(b)})}
function selectStylist(id,btn){selectedStylist=id;selectedTime="";[...$("#stylists").children].forEach(x=>x.classList?.remove("active"));btn.classList.add("active");if(selectedDate)renderSlots()}
function renderDates(){const box=$("#dates");box.innerHTML="";const now=new Date(),max=Math.min(365,Math.max(0,Number(settings.maxBookingDays??60)));const start=settings.sameDayBooking===false?1:0;for(let i=start;i<=max;i++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i),b=document.createElement("button");b.type="button";b.className="choice";b.textContent=`${d.getMonth()+1}/${d.getDate()}(${["日","月","火","水","木","金","土"][d.getDay()]})`;b.onclick=()=>{[...box.children].forEach(x=>x.classList.remove("active"));b.classList.add("active");selectedDate=dateKey(d);selectedTime="";renderSlots()};box.appendChild(b)}}
async function staffDayInfo(id,date){const d=new Date(`${date}T00:00:00`),s=stylists[id],base=s.weeklySchedule?.[d.getDay()]||{enabled:false};const ov=(await get(ref(db,`shops/${shop}/dateOverrides/${date}/${id}`))).val();if(ov?.off)return null;const enabled=ov?ov.enabled!==false:base.enabled;if(!enabled)return null;return{start:ov?.start||base.start,end:ov?.end||base.end,extensionMinutes:Number(ov?.extensionMinutes??s.extensionMinutes??0),intervalMinutes:Number(s.intervalMinutes||0)}}
async function busyFor(id,date){const [grid,blocks]=await Promise.all([get(ref(db,`shops/${shop}/busyGrid/${date}/${id}`)),get(ref(db,`shops/${shop}/staffBlocks/${date}/${id}`))]);return{grid:grid.val()||{},blocks:blocks.val()||{}}}
function gridConflict(grid,start,end){for(let m=start;m<end;m+=5)if(grid[m2t(m).replace(":","")])return true;return false}function blockConflict(blocks,start,end){return Object.values(blocks).some(b=>start<t2m(b.end)&&end>t2m(b.start))}
async function candidatesFor(id){const info=await staffDayInfo(id,selectedDate);if(!info)return[];const {grid,blocks}=await busyFor(id,selectedDate),duration=durationFor(id),step=Number(settings.slotMinutes||10),start=t2m(info.start),latestEnd=t2m(info.end)+info.extensionMinutes,now=new Date(),out=[];for(let m=start;m+duration<=latestEnd;m+=step){if(selectedDate===dateKey(now)){const cutoff=Number(settings.cutoffMinutes||0);if(m<=now.getHours()*60+now.getMinutes()+cutoff)continue}const busyEnd=m+duration+info.intervalMinutes;if(gridConflict(grid,m,busyEnd)||blockConflict(blocks,m,m+duration))continue;out.push({time:m2t(m),stylistId:id,duration,interval:info.intervalMinutes})}return out}
async function renderSlots(){const box=$("#slots");box.textContent="読み込み中...";if(!selectedMenus.length||!selectedDate){box.textContent="メニューと日付を選択してください。";return}let ids=selectedStylist?[selectedStylist]:Object.keys(stylists).filter(compatible);const lists=await Promise.all(ids.map(async id=>[id,await candidatesFor(id)]));const byTime=new Map();for(const [id,list] of lists)for(const c of list)if(!byTime.has(c.time))byTime.set(c.time,c);box.innerHTML="";[...byTime.entries()].sort((a,b)=>t2m(a[0])-t2m(b[0])).forEach(([time,c])=>{const b=document.createElement("button");b.type="button";b.className="choice";b.innerHTML=`${time}<span class="slot-sub">${stylists[c.stylistId].name}・${c.duration}分</span>`;b.onclick=()=>{[...box.children].forEach(x=>x.classList.remove("active"));b.classList.add("active");selectedTime=time;selectedStylistId=c.stylistId;selectedDuration=c.duration};box.appendChild(b)});if(!box.children.length)box.textContent="この条件で予約できる時間がありません。"}
function occupiedKeys(start,duration,interval){const arr=[];for(let m=start;m<start+duration+interval;m+=5)arr.push(m2t(m).replace(":",""));return arr}
$("#bookingForm").addEventListener("submit",async e=>{e.preventDefault();const msg=$("#message");if(!selectedMenus.length||!selectedDate||!selectedTime||!selectedStylistId){msg.textContent="メニュー・担当者・日付・時間を選択してください。";return}$("#submitBtn").disabled=true;msg.textContent="空き状況を確認しています...";const id=selectedStylistId,info=await staffDayInfo(id,selectedDate),duration=durationFor(id),start=t2m(selectedTime),keys=occupiedKeys(start,duration,info.intervalMinutes),token=`b_${Date.now()}_${Math.random().toString(36).slice(2,8)}`,gridRef=ref(db,`shops/${shop}/busyGrid/${selectedDate}/${id}`);let tx;try{tx=await runTransaction(gridRef,current=>{const g=current||{};if(keys.some(k=>g[k]))return;const next={...g};keys.forEach(k=>next[k]=token);return next})}catch(err){console.error(err);msg.textContent="空き状況の確認に失敗しました。";$("#submitBtn").disabled=false;return}if(!tx.committed){msg.textContent="申し訳ありません。たった今この時間に予約が入りました。別の時間を選んでください。";$("#submitBtn").disabled=false;await renderSlots();return}const menuItems=selectedMenus.map(mid=>({id:mid,name:menus[mid]?.name||mid,duration:Number(stylists[id].menuDurations?.[mid]||0)}));const endTime=m2t(start+duration);try{const p=push(ref(db,`shops/${shop}/reservations/${selectedDate}`));await set(p,{time:selectedTime,endTime,duration,stylistId:id,stylistName:stylists[id].name,menuIds:selectedMenus,menuItems,menuSummary:menuItems.map(x=>x.name).join("＋"),name:$("#name").value.trim(),phone:$("#phone").value.trim(),note:$("#note").value.trim(),status:"reserved",busyToken:token,createdAt:Date.now()});completed={date:selectedDate,time:selectedTime,endTime,duration,stylist:stylists[id].name,menuSummary:menuItems.map(x=>x.name).join("＋")};document.querySelectorAll("main>.card").forEach(x=>x.style.display="none");$("#completeDateTime").textContent=`${Number(selectedDate.slice(5,7))}月${Number(selectedDate.slice(8,10))}日 ${selectedTime}からです。`;$("#completeDetail").textContent=`${completed.stylist} ／ ${completed.menuSummary} ／ 約${duration}分`;$("#completeCard").style.display="block";$("#completeCard").classList.add("show");window.scrollTo({top:0,behavior:"smooth"})}catch(err){console.error(err);await runTransaction(gridRef,current=>{const g=current||{};for(const k of Object.keys(g))if(g[k]===token)delete g[k];return g});msg.textContent="予約保存に失敗しました。";$("#submitBtn").disabled=false}});
function icsDate(date,time){return date.replaceAll("-","")+"T"+time.replace(":","")+"00"}$("#calendarButton").onclick=()=>{if(!completed)return;const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Salon Reservation//JP","BEGIN:VEVENT",`DTSTART;TZID=Asia/Tokyo:${icsDate(completed.date,completed.time)}`,`DTEND;TZID=Asia/Tokyo:${icsDate(completed.date,completed.endTime)}`,`SUMMARY:${(settings.shopName||shop)} 予約`,`DESCRIPTION:${completed.stylist} / ${completed.menuSummary}`,"END:VEVENT","END:VCALENDAR"].join("\r\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar;charset=utf-8"}));a.download=`${settings.shopName||"美容室"}-予約.ics`;a.click()}
</script></body></html>
