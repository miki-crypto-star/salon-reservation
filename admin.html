<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>予約管理</title><style>
:root{--bg:#f6f7f8;--card:#fff;--text:#1f2937;--sub:#6b7280;--line:#e5e7eb;--dark:#111827;--danger:#b91c1c;--accent:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--dark);color:#fff;padding:18px 20px}header h1{margin:0;font-size:21px}main{max-width:1180px;margin:auto;padding:20px}
.card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px #0000000d}h2,h3{margin-top:0}
label{display:block;margin:10px 0 5px;font-weight:700}.muted{color:var(--sub);font-size:14px}.small{font-size:12px}.big{font-size:27px;font-weight:850}
input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;background:#fff}textarea{min-height:80px}
button,.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--dark);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#fff!important;color:var(--dark)!important;border:1px solid #d1d5db!important}.danger{background:var(--danger)!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.message{font-weight:700;margin-top:10px}.choice{background:#fff;color:var(--dark);border:1px solid #d1d5db;margin:4px}.choice.active{background:var(--dark);color:#fff}.choice:disabled{opacity:.35;cursor:not-allowed}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px}.warn{background:#fff7ed;padding:12px;border-radius:10px;font-weight:700}.hidden{display:none!important}.center{text-align:center}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.staffCol{border-left:4px solid #d1d5db;padding-left:12px}
@media(max-width:760px){main{padding:12px}.grid2,.grid3,.grid4{grid-template-columns:1fr}.row>*{flex-basis:100%}th,td{font-size:12px;padding:6px}}
</style></head><body><header><h1>予約管理</h1></header><main><nav><a class="btn secondary" href="settings.html">設定</a><button id="logout" class="secondary">ログアウト</button></nav>
<section class="card"><div class="row"><button id="prev" class="secondary">前日</button><input id="date" type="date"><button id="next" class="secondary">翌日</button></div></section><section class="card"><h2 id="heading"></h2><div id="board"></div></section>
<section id="editBox" class="card hidden"><h2>予約変更</h2><div class="grid2"><div><label>担当</label><select id="eStaff"></select></div><div><label>開始時間</label><input id="eStart" type="time"></div></div><br><div class="row"><button id="saveEdit">変更を保存</button><button id="cancelEdit" class="secondary">閉じる</button></div><div id="editMsg" class="message"></div></section>
<section class="card"><h2>電話・LINE・店頭予約</h2><div class="grid3"><div><label>担当</label><select id="aStaff"></select></div><div><label>開始</label><input id="aStart" type="time"></div><div><label>お名前</label><input id="aName"></div></div><label>メニュー</label><div id="aMenus"></div><label>電話番号</label><input id="aPhone"><label>備考</label><textarea id="aNote"></textarea><br><br><button id="addBooking">予約追加</button><div id="msg" class="message"></div></section>
<section class="card"><h2>休憩・私用などの予定ブロック</h2><div class="grid3"><div><label>担当</label><select id="bStaff"></select></div><div><label>開始</label><input id="bStart" type="time"></div><div><label>終了</label><input id="bEnd" type="time"></div></div><label>内容</label><input id="bTitle" placeholder="休憩・私用など"><br><br><button id="addBlock">予定を追加</button></section>
<section class="card"><h2>その日の勤務変更</h2><div class="grid3"><div><label>担当</label><select id="oStaff"></select></div><div><label>出勤</label><input id="oStart" type="time"></div><div><label>退勤</label><input id="oEnd" type="time"></div></div><label><input id="oOff" style="width:auto" type="checkbox"> この日は休み</label><div class="row"><button id="saveOverride">この日の勤務を保存</button><button id="clearOverride" class="secondary">通常勤務に戻す</button></div></section>
</main><script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getDatabase, ref, get, set, update, push, remove, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyBH_4WbAPUfJe5L6cqveey4Qj7UYndyG8o",
  authDomain: "salon-reservation-74af5.firebaseapp.com",
  databaseURL: "https://salon-reservation-74af5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "salon-reservation-74af5",
  storageBucket: "salon-reservation-74af5.firebasestorage.app",
  messagingSenderId: "999192738309",
  appId: "1:999192738309:web:584f3724a552b80a0bba6c"
};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);let shop='',menus={},staff={};
const fmt=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`,tmin=t=>{const[a,b]=t.split(':').map(Number);return a*60+b},lockKeys=(start,end)=>{const a=[];for(let m=Math.floor(start/5)*5;m<end;m+=5)a.push(String(m));return a};
date.value=new Date().toISOString().slice(0,10);
onAuthStateChanged(auth,async u=>{if(!u){location.href='login.html';return}const s=await get(ref(db,`users/${u.uid}/shopCode`));if(!s.exists()){location.href='login.html';return}shop=s.val();const v=(await get(ref(db,`shops/${shop}`))).val()||{};menus=v.menus||{};staff=v.staff||{};for(const [id,sf] of Object.entries(staff)){aStaff.add(new Option(sf.name,id));bStaff.add(new Option(sf.name,id));oStaff.add(new Option(sf.name,id));eStaff.add(new Option(sf.name,id))}for(const [id,m] of Object.entries(menus))aMenus.insertAdjacentHTML('beforeend',`<label class="item"><input style="width:auto" type="checkbox" value="${id}"> ${m.name}</label>`);await render()});
logout.onclick=async()=>{await signOut(auth);localStorage.clear();location.href='login.html'};date.onchange=render;prev.onclick=()=>move(-1);next.onclick=()=>move(1);function move(n){const d=new Date(date.value+'T12:00:00');d.setDate(d.getDate()+n);date.value=d.toISOString().slice(0,10);render()}
async function render(){if(!shop)return;heading.textContent=date.value;const [rSnap,bSnap,oSnap]=await Promise.all([get(ref(db,`shops/${shop}/reservations/${date.value}`)),get(ref(db,`shops/${shop}/blocks/${date.value}`)),get(ref(db,`shops/${shop}/workOverrides/${date.value}`))]);const reservations=rSnap.val()||{},blocks=bSnap.val()||{},ovs=oSnap.val()||{};board.innerHTML='';for(const [sid,s] of Object.entries(staff)){const box=document.createElement('div');box.className='item staffCol';box.innerHTML=`<h3>${s.name}</h3>`;const rs=Object.entries(reservations).filter(([id,x])=>x.staffId===sid&&x.status!=='cancelled').sort((a,b)=>a[1].start-b[1].start);rs.forEach(([id,x])=>box.insertAdjacentHTML('beforeend',`<div class="item"><b>${fmt(x.start)}〜${fmt(x.end)}　${x.name}</b><br>${Object.values(x.menus||{}).map(m=>m.name).join('＋')} <span class="pill">${x.source==='manual'?'店頭/電話/LINE':'Web'}</span><br><span class="muted">${x.phone||''}</span><div class="row" style="margin-top:8px"><button class="secondary" data-loadedit="${id}">変更</button><button class="danger" data-cancel="${id}" data-sid="${sid}">キャンセル</button></div></div>`));Object.entries(blocks[sid]||{}).sort((a,b)=>a[1].start-b[1].start).forEach(([id,x])=>box.insertAdjacentHTML('beforeend',`<div class="item"><b>${fmt(x.start)}〜${fmt(x.end)}　予定</b> ${x.title||''} <button class="danger" data-delblock="${id}" data-sid="${sid}">削除</button></div>`));if(!rs.length&&!Object.keys(blocks[sid]||{}).length)box.insertAdjacentHTML('beforeend','<p class="muted">予約・予定なし</p>');if(ovs[sid])box.insertAdjacentHTML('beforeend',`<p class="pill">当日勤務：${ovs[sid].off?'休み':`${ovs[sid].start}〜${ovs[sid].end}`}</p>`);board.append(box)}}
async function acquire(datev,sid,start,end,gap,bid){const rr=ref(db,`shops/${shop}/locks/${datev}/${sid}`),need=lockKeys(start,end+gap);let ok=false;const tx=await runTransaction(rr,c=>{c=c||{};if(need.some(k=>c[k]&&c[k]!==bid))return;for(const k of need)c[k]=bid;ok=true;return c});return ok&&tx.committed}
async function release(datev,sid,bid){await runTransaction(ref(db,`shops/${shop}/locks/${datev}/${sid}`),c=>{if(!c)return c;for(const[k,v]of Object.entries(c))if(v===bid)delete c[k];return c})}
addBooking.onclick=async()=>{msg.textContent='';const sid=aStaff.value,selected=[...aMenus.querySelectorAll('input:checked')].map(x=>x.value);if(!sid||!aStart.value||!aName.value.trim()||!selected.length){msg.textContent='担当・開始・名前・メニューを入力してください。';return}if(!selected.every(mid=>staff[sid]?.services?.[mid]?.enabled)){msg.textContent='担当者が対応できないメニューが含まれています。';return}const start=tmin(aStart.value),dur=selected.reduce((n,mid)=>n+(+staff[sid].services[mid].minutes||+menus[mid].baseMinutes||0),0),end=start+dur,gap=+staff[sid].intervalMinutes||0,id=push(ref(db,`shops/${shop}/reservations/${date.value}`)).key;if(!await acquire(date.value,sid,start,end,gap,id)){msg.textContent='その時間は既存予約と重なります。';return}const rec={staffId:sid,staffName:staff[sid].name,start,end,menus:selected.reduce((o,mid)=>(o[mid]={name:menus[mid].name,minutes:+staff[sid].services[mid].minutes||+menus[mid].baseMinutes},o),{}),name:aName.value.trim(),phone:aPhone.value.trim(),note:aNote.value.trim(),status:'reserved',source:'manual',createdAt:Date.now()};try{await set(ref(db,`shops/${shop}/reservations/${date.value}/${id}`),rec);msg.textContent='予約を追加しました。';render()}catch(err){await release(date.value,sid,id);msg.textContent='保存に失敗しました。'}};
addBlock.onclick=async()=>{if(!bStart.value||!bEnd.value||tmin(bEnd.value)<=tmin(bStart.value))return;await set(push(ref(db,`shops/${shop}/blocks/${date.value}/${bStaff.value}`)),{start:tmin(bStart.value),end:tmin(bEnd.value),title:bTitle.value.trim()});render()};saveOverride.onclick=async()=>{await set(ref(db,`shops/${shop}/workOverrides/${date.value}/${oStaff.value}`),{off:oOff.checked,start:oStart.value||'09:00',end:oEnd.value||'19:00'});render()};clearOverride.onclick=async()=>{await remove(ref(db,`shops/${shop}/workOverrides/${date.value}/${oStaff.value}`));render()};
let editingId='';document.addEventListener('click',async e=>{if(e.target.dataset.cancel){const id=e.target.dataset.cancel,sid=e.target.dataset.sid;await update(ref(db,`shops/${shop}/reservations/${date.value}/${id}`),{status:'cancelled'});await release(date.value,sid,id);render()}if(e.target.dataset.delblock){await remove(ref(db,`shops/${shop}/blocks/${date.value}/${e.target.dataset.sid}/${e.target.dataset.delblock}`));render()}if(e.target.dataset.loadedit){editingId=e.target.dataset.loadedit;const snap=await get(ref(db,`shops/${shop}/reservations/${date.value}/${editingId}`));const rec=snap.val();if(!rec)return;eStaff.value=rec.staffId;eStart.value=fmt(rec.start);editBox.classList.remove('hidden')}});
saveEdit.onclick=async()=>{if(!editingId)return;const rr=ref(db,`shops/${shop}/reservations/${date.value}/${editingId}`),snap=await get(rr),rec=snap.val();if(!rec)return;const newSid=eStaff.value,newStart=tmin(eStart.value),mids=Object.keys(rec.menus||{});if(!mids.every(mid=>staff[newSid]?.services?.[mid]?.enabled)){editMsg.textContent='変更先担当者が対応できないメニューがあります。';return}const dur=mids.reduce((n,mid)=>n+(+staff[newSid].services[mid].minutes||+menus[mid].baseMinutes||0),0),newEnd=newStart+dur,newGap=+staff[newSid].intervalMinutes||0;await release(date.value,rec.staffId,editingId);const ok=await acquire(date.value,newSid,newStart,newEnd,newGap,editingId);if(!ok){await acquire(date.value,rec.staffId,rec.start,rec.end,+staff[rec.staffId].intervalMinutes||0,editingId);editMsg.textContent='変更先時間は埋まっています。';return}await update(rr,{staffId:newSid,staffName:staff[newSid].name,start:newStart,end:newEnd});editMsg.textContent='変更しました。';editBox.classList.add('hidden');editingId='';render()};cancelEdit.onclick=()=>{editingId='';editBox.classList.add('hidden')};
</script></body></html>
