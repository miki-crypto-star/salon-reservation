<header><h1>予約管理</h1></header><main><nav><a class="btn secondary" href="settings.html">設定</a><button id="logout" class="secondary">ログアウト</button></nav>

<section class="card"><h2>その日の勤務変更</h2><div class="grid3"><div><label>担当</label><select id="oStaff"></select></div><div><label>出勤</label><input id="oStart" type="time"></div><div><label>退勤</label><input id="oEnd" type="time"></div></div><label><input id="oOff" style="width:auto" type="checkbox"> この日は休み</label><div class="row"><button id="saveOverride">この日の勤務を保存</button><button id="clearOverride" class="secondary">通常勤務に戻す</button></div><div id="overrideMsg" class="message"></div></section>

logout.onclick=async()=>{await signOut(auth);localStorage.clear();location.href='login.html'};date.onchange=render;prev.onclick=()=>move(-1);next.onclick=()=>move(1);function move(n){const d=new Date(date.value+'T12:00:00');d.setDate(d.getDate()+n);date.value=dkey(d);render()}

async function render(){if(!shop)return;heading.textContent=date.value;try{const [rs,bs,os]=await Promise.all([get(ref(db,`shops/${shop}/reservations/${date.value}`)),get(ref(db,`shops/${shop}/blocks/${date.value}`)),get(ref(db,`shops/${shop}/workOverrides/${date.value}`))]);const reservations=rs.val()||{},blocks=bs.val()||{},ovs=os.val()||{};board.innerHTML='';for(const [sid,s] of Object.entries(staff)){const box=document.createElement('div');box.className='item staffCol';box.innerHTML=`<h3>${esc(s.name)}</h3>`;const rlist=Object.entries(reservations).filter(([_,x])=>x.staffId===sid&&x.status!=='cancelled').sort((a,b)=>a[1].start-b[1].start);for(const [id,x] of rlist)box.insertAdjacentHTML('beforeend',`<div class="item"><b>${fmt(x.start)}〜${fmt(x.end)}　${esc(x.name)}</b><br>${Object.values(x.menus||{}).map(m=>esc(m.name)).join('＋')} <span class="pill">${x.source==='manual'?'店頭/電話/LINE':'Web'}</span><br><span class="muted">${esc(x.phone||'')}</span><div class="row" style="margin-top:8px"><button class="secondary" data-edit="${id}">変更</button><button class="danger" data-cancel="${id}" data-sid="${sid}">キャンセル</button></div></div>`);for(const [id,x] of Object.entries(blocks[sid]||{}).sort((a,b)=>a[1].start-b[1].start))box.insertAdjacentHTML('beforeend',`<div class="item"><b>${fmt(x.start)}〜${fmt(x.end)}　予定</b> ${esc(x.title||'')} <button class="danger" data-delblock="${id}" data-sid="${sid}">削除</button></div>`);if(!rlist.length&&!Object.keys(blocks[sid]||{}).length)box.insertAdjacentHTML('beforeend','<p class="muted">予約・予定なし</p>');if(ovs[sid])box.insertAdjacentHTML('beforeend',`<p class="pill">当日勤務：${ovs[sid].off?'休み':`${ovs[sid].start}〜${ovs[sid].end}`}</p>`);board.append(box)}if(!Object.keys(staff).length)board.innerHTML='<p class="muted">スタイリストが登録されていません。設定画面から登録してください。</p>';}catch(err){console.error(err);board.textContent='予約一覧を読み込めません：'+(err.code||err.message||err);}}
function scheduleFor(sid,dateStr,override){const d=new Date(dateStr+'T12:00:00'),w=override||staff[sid]?.weekly?.[d.getDay()];return !w||w.off?null:w}

addBooking.onclick=async()=>{msg.textContent='';const sid=aStaff.value,mids=[...aMenus.querySelectorAll('input:checked')].map(x=>x.value);if(!sid||!aStart.value||!aName.value.trim()||!mids.length){msg.textContent='担当・開始・名前・メニューを入力してください。';return}const dur=mids.reduce((n,mid)=>n+(+staff[sid]?.services?.[mid]?.minutes||+menus[mid]?.baseMinutes||0),0),start=tmin(aStart.value),end=start+dur,gap=+staff[sid].intervalMinutes||0,why=await validateSlot(date.value,sid,start,end);if(why){msg.textContent=why;return}const id=push(ref(db,`shops/${shop}/reservations/${date.value}`)).key;if(!await acquire(date.value,sid,start,end,gap,id)){msg.textContent='その時間は既存予約と重なります。';return}const rec={staffId:sid,staffName:staff[sid].name,start,end,menus:mids.reduce((o,mid)=>(o[mid]={name:menus[mid].name,minutes:+staff[sid].services[mid].minutes||+menus[mid].baseMinutes},o),{}),name:aName.value.trim(),phone:aPhone.value.trim(),note:aNote.value.trim(),status:'reserved',source:'manual',createdAt:Date.now()};try{await set(ref(db,`shops/${shop}/reservations/${date.value}/${id}`),rec);msg.textContent='予約を追加しました。';await render()}catch(err){await release(date.value,sid,id);msg.textContent='保存に失敗しました：'+(err.code||err.message||err)}};
