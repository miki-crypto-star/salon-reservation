<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>予約管理</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f7f8;color:#1f2937}
header{background:#111827;color:white;padding:18px 20px}header h1{margin:0;font-size:21px}
main{max-width:900px;margin:auto;padding:20px}.card{background:white;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px #0000000d}
label{display:block;margin:12px 0 5px;font-weight:650}input,select,textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;font:inherit}
textarea{min-height:80px}button,.btn{border:0;border-radius:9px;padding:11px 15px;background:#111827;color:white;cursor:pointer;text-decoration:none;display:inline-block;font:inherit}
button:disabled{background:#d1d5db}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{background:white;color:#111827;border:1px solid #d1d5db}.choice.active{background:#111827;color:white}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.muted{color:#6b7280}.message{margin-top:12px;font-weight:650}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.complete{display:none;text-align:center}.complete.show{display:block}.datetime{font-size:30px;font-weight:850;padding:20px;border:2px solid #111827;border-radius:14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}main{padding:12px}}
</style></head><body>
<header><h1>予約管理</h1></header><main><nav><a class="btn" href="admin.html">予約管理</a><a class="btn" href="settings.html">設定</a><button id="logout">ログアウト</button></nav>
<div class="card"><label>日付</label><input id="date" type="date"><label>出勤スタッフ人数</label><input id="staffCount" type="number" min="0"><br><br><button id="saveStaff">人数を保存</button></div>
<div class="card"><h2>スタッフ休憩</h2><p class="muted">休憩にする時間を選ぶと、その人数分だけ予約可能数を減らします。</p><div class="grid2"><div><input id="breakTime" type="time"><input id="breakCount" type="number" min="1" value="1"></div><button id="addBreak">休憩を設定</button></div><div id="breaks"></div></div>
<div class="card"><h2>予約一覧</h2><div id="list"></div></div></main>
<script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getDatabase, ref, get, set, update, push, remove, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyBH_4WbAPUfJe5L6cqveey4Qj7UYndyG8o",
  authDomain: "salon-reservation-74af5.firebaseapp.com",
  databaseURL: "https://salon-reservation-74af5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "salon-reservation-74af5",
  storageBucket: "salon-reservation-74af5.firebasestorage.app",
  messagingSenderId: "999192738309",
  appId: "1:999192738309:web:584f3724a552b80a0bba6c"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);let shop="";
onAuthStateChanged(auth,async u=>{if(!u){location.href="login.html";return}const s=await get(ref(db,`users/${u.uid}/shopCode`));if(!s.exists()){location.href="login.html";return}shop=s.val();load();});
logout.onclick=async()=>{await signOut(auth);localStorage.clear();location.href="login.html"};
date.value=new Date().toISOString().slice(0,10);date.onchange=load;
async function load(){if(!shop)return;const d=date.value;const [r,s,b]=await Promise.all([get(ref(db,`shops/${shop}/reservations/${d}`)),get(ref(db,`shops/${shop}/staffing/${d}/staffCount`)),get(ref(db,`shops/${shop}/staffBreaks/${d}`))]);
staffCount.value=s.exists()?s.val():"";const rs=r.val()||{};const rows=Object.entries(rs).sort((a,b)=>a[1].time.localeCompare(b[1].time));list.innerHTML=rows.length?`<table><tr><th>時間</th><th>名前</th><th>連絡先</th><th>スタイル</th></tr>${rows.map(([k,v])=>`<tr><td>${v.time}</td><td>${v.name}</td><td>${v.phone}</td><td>${v.style}</td></tr>`).join("")}</table>`:"予約はありません。";
const bs=b.val()||{};breaks.innerHTML=Object.entries(bs).map(([k,v])=>`<p>${k.slice(0,2)}:${k.slice(2)}　${v}人休憩 <button data-k="${k}" class="del">解除</button></p>`).join("");document.querySelectorAll(".del").forEach(x=>x.onclick=async()=>{await remove(ref(db,`shops/${shop}/staffBreaks/${d}/${x.dataset.k}`));load()});}
saveStaff.onclick=async()=>{await set(ref(db,`shops/${shop}/staffing/${date.value}/staffCount`),Number(staffCount.value||0));load()};
addBreak.onclick=async()=>{if(!breakTime.value)return;await set(ref(db,`shops/${shop}/staffBreaks/${date.value}/${breakTime.value.replace(":","")}`),Number(breakCount.value||1));load()};
</script></body></html>
