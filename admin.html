<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>予約管理</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f7f8;color:#1f2937}header{background:#111827;color:#fff;padding:18px 20px}header h1{margin:0;font-size:21px}main{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px #0000000d}button,.btn,input,select,textarea{font:inherit}button,.btn{border:0;border-radius:9px;padding:9px 13px;background:#111827;color:#fff;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#fff;color:#111827;border:1px solid #d1d5db}.danger{background:#b91c1c}.warn{background:#92400e}input,select,textarea{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted{color:#6b7280;font-size:14px}.stylist{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:12px 0}.stylist h3{margin:0}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.booking{border-left:5px solid #111827;background:#f9fafb;border-radius:9px;padding:11px;margin:9px 0}.booking-time{font-size:18px;font-weight:850}.free{font-size:13px;color:#166534;margin:8px 0;line-height:1.8}.block{display:inline-block;background:#fef3c7;color:#92400e;padding:4px 8px;border-radius:999px;margin:3px;font-size:12px}.form-panel{display:none}.form-panel.show{display:block}.menu-check{display:flex;gap:8px;align-items:center;padding:7px 0}.menu-check input{width:auto}.message{font-weight:700;margin-top:10px}@media(max-width:700px){main{padding:12px}.grid2,.grid3{grid-template-columns:1fr}}
</style></head><body><header><h1 id="title">予約管理</h1></header><main>
<div class="actions" style="margin-bottom:14px"><a class="btn" href="settings.html">設定</a><button id="logout" type="button">ログアウト</button></div>
<section class="card"><div class="grid2"><div><h2 style="margin-top:0">スタイリスト別 予約表</h2><p class="muted">予約・休憩・私用などの予定を担当者ごとに管理します。</p></div><div><label>表示日</label><input id="targetDate" type="date"></div></div><div id="summary" class="muted"></div><div id="staffBoards"></div></section>

<section id="bookingPanel" class="card form-panel"><h2>電話・店頭予約</h2><div class="grid2"><div><label>スタイリスト</label><select id="bookStylist"></select></div><div><label>開始時間</label><input id="bookTime" type="time"></div></div><label>メニュー</label><div id="bookMenus"></div><div id="bookDuration" class="muted"></div><div class="grid2"><div><label>お名前</label><input id="bookName"></div><div><label>連絡先</label><input id="bookPhone"></div></div><label>備考</label><textarea id="bookNote"></textarea><div class="actions" style="margin-top:12px"><button id="saveBooking" type="button">予約を保存</button><button id="closeBooking" class="secondary" type="button">閉じる</button></div><div id="bookMessage" class="message"></div></section>

<section id="overridePanel" class="card form-panel"><h2>この日の勤務変更</h2><input id="ovStylistId" type="hidden"><div class="grid3"><div><label>状態</label><select id="ovEnabled"><option value="true">出勤</option><option value="false">休み</option></select></div><div><label>出勤</label><input id="ovStart" type="time"></div><div><label>退勤</label><input id="ovEnd" type="time"></div></div><label>この日だけの延長許容（分・空欄なら通常設定）</label><input id="ovExtension" type="number" min="0" step="5"><div class="actions" style="margin-top:12px"><button id="saveOverride" type="button">保存</button><button id="clearOverride" class="secondary" type="button">通常勤務に戻す</button><button id="closeOverride" class="secondary" type="button">閉じる</button></div></section>

<section id="blockPanel" class="card form-panel"><h2>予定・休憩をブロック</h2><input id="blockStylistId" type="hidden"><div class="grid3"><div><label>開始</label><input id="blockStart" type="time"></div><div><label>終了</label><input id="blockEnd" type="time"></div><div><label>内容</label><input id="blockLabel" placeholder="休憩・私用など"></div></div><div class="actions" style="margin-top:12px"><button id="saveBlock" type="button">予定を追加</button><button id="closeBlock" class="secondary" type="button">閉じる</button></div></section>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";import { getAuth,onAuthStateChanged,signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";import { getDatabase,ref,get,set,update,push,remove,runTransaction } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyBH_4WbAPUfJe5L6cqveey4Qj7UYndyG8o",
  authDomain: "salon-reservation-74af5.firebaseapp.com",
  databaseURL: "https://salon-reservation-74af5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "salon-reservation-74af5",
  storageBucket: "salon-reservation-74af5.firebasestorage.app",
  messagingSenderId: "999192738309",
  appId: "1:999192738309:web:584f3724a552b80a0bba6c"
};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),$=s=>document.querySelector(s);let shop="",settings={},menus={},stylists={},bookings={},overrides={},blocks={},busy={};
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}function t2m(t){const [h,m]=t.split(":").map(Number);return h*60+m}function m2t(n){return `${String(Math.floor(n/60)).padStart(2,"0")}:${String(n%60).padStart(2,"0")}`}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("#targetDate").value=dateKey(new Date());
onAuthStateChanged(auth,async u=>{if(!u){location.href="login.html";return}const s=await get(ref(db,`users/${u.uid}/shopCode`));if(!s.exists())return alert("店舗設定がありません");shop=s.val();await loadBase();await loadDay()});$("#logout").onclick=async()=>{await signOut(auth);location.href="login.html"};$("#targetDate").onchange=loadDay;
async function loadBase(){const [a,b,c]=await Promise.all([get(ref(db,`shops/${shop}/settings`)),get(ref(db,`shops/${shop}/menus`)),get(ref(db,`shops/${shop}/stylists`))]);settings=a.val()||{};menus=b.val()||{};stylists=c.val()||{};$("#title").textContent=`${settings.shopName||shop}｜予約管理`}
async function loadDay(){const d=$("#targetDate").value;const [r,o,b,g]=await Promise.all([get(ref(db,`shops/${shop}/reservations/${d}`)),get(ref(db,`shops/${shop}/dateOverrides/${d}`)),get(ref(db,`shops/${shop}/staffBlocks/${d}`)),get(ref(db,`shops/${shop}/busyGrid/${d}`))]);bookings=r.val()||{};overrides=o.val()||{};blocks=b.val()||{};busy=g.val()||{};renderBoards()}
function dayInfo(id){const d=new Date(`${$("#targetDate").value}T00:00:00`),s=stylists[id],base=s.weeklySchedule?.[d.getDay()]||{enabled:false};const ov=overrides[id];if(ov&&ov.enabled===false)return null;const enabled=ov?ov.enabled!==false:base.enabled;if(!enabled)return null;return{start:ov?.start||base.start,end:ov?.end||base.end,extensionMinutes:Number(ov?.extensionMinutes??s.extensionMinutes??0),intervalMinutes:Number(s.intervalMinutes||0)}}
function bookingList(id){return Object.entries(bookings).filter(([,b])=>b.stylistId===id&&b.status!=="cancelled").sort((a,b)=>t2m(a[1].time)-t2m(b[1].time))}
function renderBoards(){const box=$("#staffBoards");box.innerHTML="";const active=Object.entries(stylists).filter(([,s])=>s.active!==false).sort((a,b)=>(a[1].sort||0)-(b[1].sort||0));$("#summary").textContent=`${$("#targetDate").value}　予約 ${Object.values(bookings).filter(b=>b.status!=="cancelled").length}件`;for(const [id,s] of active){const info=dayInfo(id),list=bookingList(id),el=document.createElement("section");el.className="stylist";const bl=Object.entries(blocks[id]||{});el.innerHTML=`<div class="head"><div><h3>${esc(s.name)}</h3><div class="muted">${info?`${info.start}〜${info.end} ／ 延長 ${info.extensionMinutes}分 ／ インターバル ${info.intervalMinutes}分`:"休み"}</div></div><div class="actions"><button class="phone" type="button" ${!info?"disabled":""}>＋予約</button><button class="blockBtn warn" type="button" ${!info?"disabled":""}>予定</button><button class="ov secondary" type="button">勤務変更</button></div></div><div class="blocks">${bl.map(([bid,x])=>`<span class="block">${esc(x.start)}〜${esc(x.end)} ${esc(x.label||"予定")} <button data-bid="${bid}" class="delBlock" style="padding:1px 5px;background:transparent;color:#92400e">×</button></span>`).join("")}</div><div class="list"></div>${info?`<div class="free"><b>予約開始候補：</b> ${freeStarts(id,info).join("　")||"空きなし"}</div>`:""}`;const l=el.querySelector(".list");if(!list.length)l.innerHTML='<p class="muted">予約はありません。</p>';for(const [bid,b] of list){const c=document.createElement("div");c.className="booking";c.innerHTML=`<div class="head"><div><div class="booking-time">${esc(b.time)}〜${esc(b.endTime||"")}</div><b>${esc(b.name)}</b>　${esc(b.menuSummary||b.style||"")}<div class="muted">${esc(b.phone||"")}${b.note?` ／ ${esc(b.note)}`:""}</div></div><button class="cancel danger" type="button">キャンセル</button></div>`;c.querySelector(".cancel").onclick=()=>cancelBooking(bid,b);l.appendChild(c)}el.querySelector(".phone").onclick=()=>openBooking(id);el.querySelector(".blockBtn").onclick=()=>openBlock(id);el.querySelector(".ov").onclick=()=>openOverride(id);el.querySelectorAll(".delBlock").forEach(x=>x.onclick=async()=>{await remove(ref(db,`shops/${shop}/staffBlocks/${$("#targetDate").value}/${id}/${x.dataset.bid}`));await loadDay()});box.appendChild(el)}}
function gridConflict(id,start,end){const g=busy[id]||{};for(let m=start;m<end;m+=5)if(g[m2t(m).replace(":","")])return true;return false}function blockConflict(id,start,end){return Object.values(blocks[id]||{}).some(b=>start<t2m(b.end)&&end>t2m(b.start))}
function freeStarts(id,info){const out=[],step=Number(settings.slotMinutes||10),start=t2m(info.start),end=t2m(info.end)+info.extensionMinutes;for(let m=start;m<end;m+=step){if(!gridConflict(id,m,m+5)&&!blockConflict(id,m,m+5))out.push(m2t(m))}return out.slice(0,30)}
function menuEntries(){return Object.entries(menus).filter(([,m])=>m.active!==false).sort((a,b)=>(a[1].sort||0)-(b[1].sort||0))}
function openBooking(id){$("#bookingPanel").classList.add("show");$("#bookStylist").innerHTML=Object.entries(stylists).filter(([,s])=>s.active!==false).map(([sid,s])=>`<option value="${sid}" ${sid===id?"selected":""}>${esc(s.name)}</option>`).join("");$("#bookTime").value=dayInfo(id)?.start||"09:00";renderBookMenus();$("#bookingPanel").scrollIntoView({behavior:"smooth"})}function renderBookMenus(){const id=$("#bookStylist").value,box=$("#bookMenus");box.innerHTML="";for(const [mid,m] of menuEntries()){const dur=Number(stylists[id]?.menuDurations?.[mid]||0);if(dur<=0)continue;const l=document.createElement("label");l.className="menu-check";l.innerHTML=`<input type="checkbox" value="${mid}"> ${esc(m.name)}（${dur}分）`;l.querySelector("input").onchange=updateBookDuration;box.appendChild(l)}updateBookDuration()}$("#bookStylist").onchange=renderBookMenus;function selectedBookMenus(){return [...$("#bookMenus").querySelectorAll("input:checked")].map(x=>x.value)}function updateBookDuration(){const id=$("#bookStylist").value,d=selectedBookMenus().reduce((n,mid)=>n+Number(stylists[id]?.menuDurations?.[mid]||0),0);$("#bookDuration").textContent=d?`合計施術時間：${d}分`:"メニューを選択してください。"}
$("#closeBooking").onclick=()=>$("#bookingPanel").classList.remove("show");$("#saveBooking").onclick=async()=>{const id=$("#bookStylist").value,sel=selectedBookMenus(),info=dayInfo(id),msg=$("#bookMessage");if(!info||!sel.length||!$("#bookName").value.trim())return msg.textContent="スタイリスト・メニュー・お名前を確認してください。";const duration=sel.reduce((n,mid)=>n+Number(stylists[id].menuDurations?.[mid]||0),0),start=t2m($("#bookTime").value),maxEnd=t2m(info.end)+info.extensionMinutes;if(start+duration>maxEnd)return msg.textContent="施術終了が、この日の延長許容時間を超えます。";if(blockConflict(id,start,start+duration))return msg.textContent="予定ブロックと重なっています。";const token=`a_${Date.now()}_${Math.random().toString(36).slice(2,8)}`,keys=[];for(let m=start;m<start+duration+info.intervalMinutes;m+=5)keys.push(m2t(m).replace(":",""));const gridRef=ref(db,`shops/${shop}/busyGrid/${$("#targetDate").value}/${id}`),tx=await runTransaction(gridRef,current=>{const g=current||{};if(keys.some(k=>g[k]))return;const next={...g};keys.forEach(k=>next[k]=token);return next});if(!tx.committed)return msg.textContent="その時間には別の予約があります。";const items=sel.map(mid=>({id:mid,name:menus[mid].name,duration:Number(stylists[id].menuDurations[mid])}));try{await set(push(ref(db,`shops/${shop}/reservations/${$("#targetDate").value}`)),{time:$("#bookTime").value,endTime:m2t(start+duration),duration,stylistId:id,stylistName:stylists[id].name,menuIds:sel,menuItems:items,menuSummary:items.map(x=>x.name).join("＋"),name:$("#bookName").value.trim(),phone:$("#bookPhone").value.trim(),note:$("#bookNote").value.trim(),status:"reserved",busyToken:token,source:"admin",createdAt:Date.now()});$("#bookName").value=$("#bookPhone").value=$("#bookNote").value="";$("#bookingPanel").classList.remove("show");await loadDay()}catch(e){await runTransaction(gridRef,current=>{const g=current||{};for(const k of Object.keys(g))if(g[k]===token)delete g[k];return g});msg.textContent="保存できませんでした。"}}
async function cancelBooking(bid,b){if(!confirm(`${b.time} ${b.name} 様の予約をキャンセルしますか？`))return;await update(ref(db,`shops/${shop}/reservations/${$("#targetDate").value}/${bid}`),{status:"cancelled",cancelledAt:Date.now()});if(b.busyToken&&b.stylistId){await runTransaction(ref(db,`shops/${shop}/busyGrid/${$("#targetDate").value}/${b.stylistId}`),current=>{const g=current||{};for(const k of Object.keys(g))if(g[k]===b.busyToken)delete g[k];return g})}await loadDay()}
function openOverride(id){const d=new Date(`${$("#targetDate").value}T00:00:00`),base=stylists[id].weeklySchedule?.[d.getDay()]||{enabled:false,start:"09:00",end:"19:00"},ov=overrides[id];$("#ovStylistId").value=id;$("#ovEnabled").value=String(ov?ov.enabled!==false:base.enabled);$("#ovStart").value=ov?.start||base.start||"09:00";$("#ovEnd").value=ov?.end||base.end||"19:00";$("#ovExtension").value=ov?.extensionMinutes??"";$("#overridePanel").classList.add("show");$("#overridePanel").scrollIntoView({behavior:"smooth"})}$("#saveOverride").onclick=async()=>{const id=$("#ovStylistId").value,p={enabled:$("#ovEnabled").value==="true",start:$("#ovStart").value,end:$("#ovEnd").value};if($("#ovExtension").value!=="")p.extensionMinutes=Number($("#ovExtension").value);await set(ref(db,`shops/${shop}/dateOverrides/${$("#targetDate").value}/${id}`),p);$("#overridePanel").classList.remove("show");await loadDay()};$("#clearOverride").onclick=async()=>{await remove(ref(db,`shops/${shop}/dateOverrides/${$("#targetDate").value}/${$("#ovStylistId").value}`));$("#overridePanel").classList.remove("show");await loadDay()};$("#closeOverride").onclick=()=>$("#overridePanel").classList.remove("show");
function openBlock(id){$("#blockStylistId").value=id;const info=dayInfo(id);$("#blockStart").value=info?.start||"12:00";$("#blockEnd").value=info?m2t(Math.min(t2m(info.start)+60,t2m(info.end))):"13:00";$("#blockLabel").value="休憩";$("#blockPanel").classList.add("show");$("#blockPanel").scrollIntoView({behavior:"smooth"})}$("#saveBlock").onclick=async()=>{const id=$("#blockStylistId").value,start=$("#blockStart").value,end=$("#blockEnd").value;if(!start||!end||t2m(end)<=t2m(start))return alert("開始・終了時間を確認してください。");if(gridConflict(id,t2m(start),t2m(end)))return alert("すでに予約が入っている時間には予定を入れられません。");await set(push(ref(db,`shops/${shop}/staffBlocks/${$("#targetDate").value}/${id}`)),{start,end,label:$("#blockLabel").value.trim()||"予定",createdAt:Date.now()});$("#blockPanel").classList.remove("show");await loadDay()};$("#closeBlock").onclick=()=>$("#blockPanel").classList.remove("show");
</script></body></html>
