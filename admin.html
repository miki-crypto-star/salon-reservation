<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>予約管理</title><style>
:root{--bg:#f6f7f8;--card:#fff;--text:#1f2937;--sub:#6b7280;--line:#e5e7eb;--dark:#111827;--danger:#b91c1c;--accent:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--dark);color:#fff;padding:18px 20px}header h1{margin:0;font-size:21px}main{max-width:1180px;margin:auto;padding:20px}
.card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px #0000000d}h2,h3{margin-top:0}
label{display:block;margin:10px 0 5px;font-weight:700}.muted{color:var(--sub);font-size:14px}.small{font-size:12px}.big{font-size:27px;font-weight:850}
input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px;background:#fff}textarea{min-height:80px}
button,.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--dark);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#fff!important;color:var(--dark)!important;border:1px solid #d1d5db!important}.danger{background:var(--danger)!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.message{font-weight:700;margin-top:10px}.choice{background:#fff;color:var(--dark);border:1px solid #d1d5db;margin:4px}.choice.active{background:var(--dark);color:#fff}.choice:disabled{opacity:.35;cursor:not-allowed}
.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px}.warn{background:#fff7ed;padding:12px;border-radius:10px;font-weight:700}.hidden{display:none!important}.center{text-align:center}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.staffCol{border-left:4px solid #d1d5db;padding-left:12px}
@media(max-width:760px){main{padding:12px}.grid2,.grid3,.grid4{grid-template-columns:1fr}.row>*{flex-basis:100%}th,td{font-size:12px;padding:6px}}
</style></head>
<body>
<header><h1>予約管理</h1></header>
<main>
<nav>
  <a class="btn secondary" href="settings.html">設定</a>
  <button id="logout" class="secondary">ログアウト</button>
</nav>

<section class="card">
  <div class="row">
    <button id="prev" class="secondary" type="button">前日</button>
    <input id="date" type="date">
    <button id="next" class="secondary" type="button">翌日</button>
  </div>
</section>

<section class="card">
  <h2>本日の予約表</h2>
  <p class="muted">スタイリストごとに予約と空き時間を表示します。空き時間を押すと「休憩・私用」にできます。</p>
  <div id="board"></div>
</section>

<section class="card">
  <h2>その日の予約受付時間を変更</h2>
  <p class="muted">通常設定と違う日だけ使います。例：この日だけ予約受付を12:00開始、15:00終了にする。</p>
  <div class="grid3">
    <div><label>スタイリスト</label><select id="oStaff"></select></div>
    <div><label>予約受付開始</label><input id="oStart" type="time" step="300"></div>
    <div><label>予約受付終了</label><input id="oEnd" type="time" step="300"></div>
  </div>
  <label><input id="oOff" style="width:auto" type="checkbox"> この日は予約受付しない</label>
  <div class="row" style="margin-top:10px">
    <button id="saveOverride" type="button">この日の予約受付時間を保存</button>
    <button id="clearOverride" class="secondary" type="button">通常の予約受付時間に戻す</button>
  </div>
  <div id="msg" class="message" style="margin-top:12px"></div>
</section>
</main>
<script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getDatabase, ref, get, set, update, push, remove, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyBH_4WbAPUfJe5L6cqveey4Qj7UYndyG8o",
  authDomain: "salon-reservation-74af5.firebaseapp.com",
  databaseURL: "https://salon-reservation-74af5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "salon-reservation-74af5",
  storageBucket: "salon-reservation-74af5.firebasestorage.app",
  messagingSenderId: "999192738309",
  appId: "1:999192738309:web:584f3724a552b80a0bba6c"
};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const date=document.getElementById('date'),board=document.getElementById('board'),
logout=document.getElementById('logout'),prev=document.getElementById('prev'),next=document.getElementById('next'),
oStaff=document.getElementById('oStaff'),oStart=document.getElementById('oStart'),oEnd=document.getElementById('oEnd'),
oOff=document.getElementById('oOff'),saveOverride=document.getElementById('saveOverride'),
clearOverride=document.getElementById('clearOverride'),msg=document.getElementById('msg');

let shop='',menus={},staff={},settings={};
const fmt=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;
const tmin=t=>{const[a,b]=t.split(':').map(Number);return a*60+b};
const time5=t=>{
  if(!t)return t;
  const [h,m]=t.split(':').map(Number);
  let total=Math.round((h*60+m)/5)*5;
  total=Math.max(0,Math.min(total,23*60+55));
  return `${String(Math.floor(total/60)).padStart(2,'0')}:${String(total%60).padStart(2,'0')}`;
};

date.value=new Date().toISOString().slice(0,10);

onAuthStateChanged(auth,async u=>{
 if(!u){location.href='login.html';return}
 const sc=await get(ref(db,`users/${u.uid}/shopCode`));
 if(!sc.exists()){location.href='login.html';return}
 shop=sc.val();
 const [ms,st,ss]=await Promise.all([
   get(ref(db,`shops/${shop}/menus`)),
   get(ref(db,`shops/${shop}/staff`)),
   get(ref(db,`shops/${shop}/settings`))
 ]);
 menus=ms.val()||{};staff=st.val()||{};settings=ss.val()||{};
 oStaff.innerHTML='';
 for(const [id,s] of Object.entries(staff)) oStaff.add(new Option(s.name,id));
 await render();
});

logout.onclick=async()=>{await signOut(auth);localStorage.clear();location.href='login.html'};
date.onchange=render;
prev.onclick=()=>move(-1);
next.onclick=()=>move(1);
function move(n){
 const d=new Date(date.value+'T12:00:00');d.setDate(d.getDate()+n);
 date.value=d.toISOString().slice(0,10);render();
}

function scheduleFor(sid, dayIndex, override){
 if(override) return override.off?null:override;
 const w=staff[sid]?.weekly?.[dayIndex];
 if(!w||w.off) return null;
 return w;
}

async function render(){
 if(!shop)return;
 const d=new Date(date.value+'T12:00:00');
 const [rSnap,bSnap,oSnap]=await Promise.all([
   get(ref(db,`shops/${shop}/reservations/${date.value}`)),
   get(ref(db,`shops/${shop}/blocks/${date.value}`)),
   get(ref(db,`shops/${shop}/workOverrides/${date.value}`))
 ]);
 const reservations=rSnap.val()||{}, blocks=bSnap.val()||{}, overrides=oSnap.val()||{};
 board.innerHTML='';

 for(const [sid,s] of Object.entries(staff)){
   const box=document.createElement('div');box.className='item';
   box.innerHTML=`<h3>${s.name}</h3>`;
   const sch=scheduleFor(sid,d.getDay(),overrides[sid]);

   if(!sch){
     box.insertAdjacentHTML('beforeend',`<p class="warn">本日休み</p>`);
     board.append(box);continue;
   }

   const start=tmin(sch.start), end=tmin(sch.end);
   const rs=Object.entries(reservations)
      .filter(([id,x])=>x.staffId===sid&&x.status!=='cancelled')
      .sort((a,b)=>a[1].start-b[1].start);
   const bs=Object.entries(blocks[sid]||{}).sort((a,b)=>a[1].start-b[1].start);

   // Timeline in 30-minute rows. Existing bookings/blocks are shown; empty rows can create a block.
   let html=`<table><tr><th>時間</th><th>内容</th></tr>`;
   const shownBookings=new Set();
   const shownBlocks=new Set();

   for(let m=start;m<end;m+=30){
     // 30分表示と、5/10/15分刻みの予約開始時刻がズレても拾えるよう
     // 「この30分枠と時間帯が重なっているか」で判定する。
     const booking=rs.find(([id,x])=>m < x.end && (m+30) > x.start);
     const block=bs.find(([id,x])=>m < x.end && (m+30) > x.start);

     if(booking){
       const [id,x]=booking;
       const first=!shownBookings.has(id);
       if(first) shownBookings.add(id);

       const menuNames=Object.values(x.menus||{}).map(v=>v.name).filter(Boolean).join('＋');
       const actualTime=`${fmt(x.start)}〜${fmt(x.end)}`;

       html+=`<tr><td>${fmt(m)}</td><td>${first
         ? `<b>${x.name||'予約'}</b>　${actualTime}${menuNames?`　${menuNames}`:''}
            <button class="danger" data-cancel="${id}" data-sid="${sid}" style="float:right">キャンセル</button>`
         : '予約中'}</td></tr>`;
     }else if(block){
       const [id,x]=block;
       const first=!shownBlocks.has(id);
       if(first) shownBlocks.add(id);

       html+=`<tr><td>${fmt(m)}</td><td>${first
         ? `<b>${x.title||'休憩・私用'}</b>　${fmt(x.start)}〜${fmt(x.end)}
            <button class="danger" data-delblock="${id}" data-sid="${sid}" style="float:right">解除</button>`
         : '予定ブロック'}</td></tr>`;
     }else{
       html+=`<tr><td>${fmt(m)}</td><td><button type="button" class="secondary" data-free="${m}" data-sid="${sid}">空き　→ 休憩・私用にする</button></td></tr>`;
     }
   }
   html+='</table>';
   box.insertAdjacentHTML('beforeend',html);
   board.append(box);
 }

 // reflect selected stylist override/default into fields
 const sid=oStaff.value;
 if(sid){
   const ov=overrides[sid];
   const def=staff[sid]?.weekly?.[d.getDay()]||{off:true,start:'09:00',end:'19:00'};
   const cur=ov||def;
   oOff.checked=!!cur.off;oStart.value=cur.start||'09:00';oEnd.value=cur.end||'19:00';
 }
}

oStaff.onchange=async()=>{
      const d=new Date(date.value+'T12:00:00');
      const ov=(await get(ref(db,`shops/${shop}/workOverrides/${date.value}/${oStaff.value}`))).val();
      const def=staff[oStaff.value]?.weekly?.[d.getDay()]||{off:true,start:'09:00',end:'19:00'};
      const cur=ov||def;
      oOff.checked=!!cur.off;
      oStart.value=cur.start||'09:00';
      oEnd.value=cur.end||'19:00';
    };

document.addEventListener('click',async e=>{
 if(e.target.dataset.free){
   const sid=e.target.dataset.sid,start=+e.target.dataset.free;
   const mins=prompt('何分ブロックしますか？','30');
   if(!mins)return;
   const dur=Math.max(5,+mins||30);
   const title=prompt('内容（例：休憩、私用）','休憩')||'休憩';
   await set(push(ref(db,`shops/${shop}/blocks/${date.value}/${sid}`)),{start,end:start+dur,title});
   await render();
 }
 if(e.target.dataset.delblock){
   await remove(ref(db,`shops/${shop}/blocks/${date.value}/${e.target.dataset.sid}/${e.target.dataset.delblock}`));
   await render();
 }
 if(e.target.dataset.cancel){
   const id=e.target.dataset.cancel,sid=e.target.dataset.sid;
   await update(ref(db,`shops/${shop}/reservations/${date.value}/${id}`),{status:'cancelled'});
   // release any lock values owned by this booking id
   await runTransaction(ref(db,`shops/${shop}/locks/${date.value}/${sid}`),cur=>{
     if(!cur)return cur;for(const [k,v] of Object.entries(cur))if(v===id)delete cur[k];return cur;
   });
   await render();
 }
});

saveOverride.onclick=async()=>{
 if(!oStaff.value){msg.textContent='スタイリストを選んでください。';return;}
 const start=time5(oStart.value||'09:00'), end=time5(oEnd.value||'19:00');
 if(!oOff.checked && tmin(end)<=tmin(start)){
   msg.textContent='終了時間は開始時間より後にしてください。';
   return;
 }
 try{
   await set(ref(db,`shops/${shop}/workOverrides/${date.value}/${oStaff.value}`),{
     off:oOff.checked,start,end
   });
   msg.textContent='この日の予約受付時間を保存しました。';
   await render();
 }catch(err){
   console.error(err);
   msg.textContent='保存できませんでした：'+(err.code||err.message||err);
 }
};

clearOverride.onclick=async()=>{
 if(!oStaff.value){msg.textContent='スタイリストを選んでください。';return;}
 try{
   await remove(ref(db,`shops/${shop}/workOverrides/${date.value}/${oStaff.value}`));
   msg.textContent='通常の予約受付時間に戻しました。';
   await render();
 }catch(err){
   console.error(err);
   msg.textContent='戻せませんでした：'+(err.code||err.message||err);
 }
};
</script></body></html>
